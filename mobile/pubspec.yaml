  crypto: ^3.0.8
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  nepali_utils: ^3.0.8
  pdf: ^3.13.1
  printing: ^5.15.1
